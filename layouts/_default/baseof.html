<!doctype html>
<html lang="{{ .Site.Language.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}Alex Qin · Android & XR Engineer{{ else }}{{ .Title }} · Alex Qin{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="author" content="Alex Qin">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta name="theme-color" content="#f7f8f4">
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
  {{ $css := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="Alex Qin" href="{{ .Permalink }}">{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="container header-inner">
    <a class="wordmark" href="{{ "/" | relURL }}" aria-label="Alex Qin home">aq<span>.</span></a>
    <nav aria-label="Main navigation">{{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}</nav>
    <a class="resume-nav" href="{{ "uploads/resume.pdf" | relURL }}">Résumé <span aria-hidden="true">↗</span></a>
  </div></header>
  <main id="main">{{ block "main" . }}{{ end }}</main>
  <footer class="container footer"><span>© {{ now.Year }} Alex Qin</span><span>Built with care. Based in Toronto.</span><a href="{{ "post/index.xml" | relURL }}">RSS <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
